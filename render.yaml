# Optional: Render Blueprint — import at https://dashboard.render.com/blueprints
services:
  - type: web
    name: durain-sms
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DURIAN_AUTO_SYNC_MINUTES
        value: "30"
      # Set secrets in the Render dashboard — see DEPLOY.md:
      # SUPABASE_URL, SUPABASE_SERVICE_KEY, SITE_AUTH_SECRET, SITE_AUTH_USERNAME, SITE_AUTH_PASSWORD
      # DURIAN_USERNAME, DURIAN_API_KEY, DURIAN_WEB_PASSWORD
      # DURIAN_USE_DISK_PANEL_COOKIE=1, DURIAN_SESSION_COOKIE (optional), CRON_SECRET (optional)
